{% extends "mail/layout.html" %}
{% load static %}

{% block body %}

    <div class="container-fluid my-5">

        <div id="hero" class="p-5 text-center rounded-3">

            <i class="bi bi-person-fill-down"></i>

            <div class="separator mt-3 mb-3 rounded-3"></div>

            <h2 class="text-white">Inbox</h2>

        </div>

    </div>

    <div class="container" >

        <h2>{{ request.user.email }}</h2>

        <div id="emails-view">
        </div>

        <div id="compose-view">
            <h3>New Email</h3>
            <form id="compose-form">

            <div class="mb-3">

                <label for="sender" class="form-label">From:</label>
                    <input disabled id="sender" type="email" class="form-control" value="{{ request.user.email }}">
                </div>

                <div class="mb-3">
                    <label for="recipient" class="form-label">To:</label>
                    <input type="email" class="form-control" id="compose-recipients" placeholder="coco@bandicoot.com">
                </div>

                <div class="mb-3">
                    <label for="recipient" class="form-label">Subject:</label>
                    <input type="text" class="form-control" id="compose-subject" placeholder="an interesting topic about Wumpa fruit!">
                </div>

                <div class="mb-3">
                    <label for="exampleFormControlTextarea1" class="form-label">Content: </label>
                <textarea class="form-control" id="compose-body" placeholder="Body" rows="3"></textarea>

            </div>

                <input type="submit" class="btn btn-primary"/>
            </form>
        </div>

    </div>

{% endblock %}

{% block script %}
    <script src="{% static 'mail/inbox.js' %}"></script>
{% endblock %}
