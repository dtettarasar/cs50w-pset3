{% extends "mail/layout.html" %}

{% block body %}

    <div class="container-fluid my-5">

        <div id="hero" class="p-5 text-center rounded-3">

            <i class="bi bi-person-fill-down"></i>

            <div class="separator mt-3 mb-3 rounded-3"></div>

            <h2 class="text-white">Login</h2>

        </div>

    </div>

    <div class="container" >

        {% if message %}
            <div>{{ message }}</div>
        {% endif %}

        <form action="{% url 'login' %}" method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input autofocus class="form-control" type="email" name="email" placeholder="crash@bandicoot.com">
            </div>

             <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input class="form-control" type="password" name="password" placeholder="Wumpaaaaaaaa!">
            </div>


            <div class="form-group">
            </div>
            <div class="form-group">
                
            </div>
            <input class="btn btn-primary" type="submit" value="Login">
        </form>

        Don't have an account? <a href="{% url 'register' %}">Register here.</a>

    </div>

{% endblock %}
